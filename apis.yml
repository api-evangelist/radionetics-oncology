name: Radionetics Oncology
description: Radionetics Oncology is a clinical-stage biotechnology company developing precision radiopharmaceutical
  treatments for cancer. The company designs small-molecule radioligands that target G-protein-coupled
  receptors (GPCRs) to selectively deliver targeted radiation therapy to solid tumors, including breast
  and lung cancer, combining GPCR biology expertise with medicinal chemistry. Radionetics entered a
  strategic agreement with Eli Lilly in 2024. It was surfaced as a portfolio company of DCVC and added
  to the API Evangelist network; the company publishes no public developer, API, or technical-integration
  surface at this time.
